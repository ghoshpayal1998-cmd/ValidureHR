# Render blueprint — ValidureHR API.
#
# Free tier, and the constraints below are the ones that actually bite:
#
#   * Free is only free while NO payment method is on file. With one, overage
#     bills; without one, it suspends instead. Leave it off.
#   * 750 instance-hours a month against 744 hours in a month, so a single
#     always-on service consumes the whole quota. Any keep-alive ping must be
#     business-hours only.
#   * Free blocks outbound SMTP on 25, 465 and 587. This silently killed every
#     email on F1HR after its cutover. Use a provider that offers 2525.
#   * Render Cron Jobs cost $1/month minimum — use an external free cron to hit
#     the /api/cron endpoints instead.
#
# Most values are set here; secrets are marked sync:false and entered in the
# dashboard so they never live in the repository.

services:
  - type: web
    name: validurehr-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    # Workspaces hoist to the repo root, so install from there and start from
    # the service's own directory.
    buildCommand: cd ../.. && npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "5050"

      # Behind Render's proxy the client IP arrives in X-Forwarded-For. Without
      # this, login rate limiting sees one client and locks out everyone.
      - key: TRUST_PROXY
        value: "1"

      # Supabase: use the SESSION pooler. The transaction pooler on 6543 is for
      # serverless and breaks prepared statements; the direct host resolves to
      # IPv6, which Render free cannot reach.
      - key: DATABASE_URL
        sync: false

      # 32+ characters, and not one of the values published in the repo — the
      # API refuses to boot otherwise, on purpose.
      - key: JWT_SECRET
        sync: false

      # 12+ characters. Only read when the platform admin is first created.
      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Storage (Supabase). The service-role key is server-side only and must
      # never appear in a frontend build.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: vhr-uploads

      # Mail. Port 2525 specifically — see the SMTP note above.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # Shared secret for the external cron caller.
      - key: CRON_SECRET
        sync: false
