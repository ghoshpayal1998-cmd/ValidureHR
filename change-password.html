<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password — ValidureHR</title>
<link rel="icon" href="assets/brand/validure-mark.svg">
<link rel="stylesheet" href="assets/css/vhr.css">
<script>try{var t=localStorage.getItem('vhr.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-root="">

<main class="page" data-page>

  <!-- The whole screen is one narrow column: the form is the only
       thing on it, so a full-width page head would leave the title
       stranded at the far left of the card. -->
  <div class="page__head" style="width:min(32rem,100%);margin-inline:auto">
    <div>
      <p class="eyebrow">Account</p>
      <h1 style="margin-top:var(--s2)">Change Password</h1>
      <p class="muted" style="font-size:.875rem;margin-top:.25rem">Update your account password</p>
    </div>
    <div class="row" style="gap:var(--s3)"><!-- page actions: none on this screen --></div>
  </div>

  <div class="stack" style="gap:var(--s5);width:min(32rem,100%);margin-inline:auto">

    <!-- ------------------------------------------------ the form -->
    <section class="card">
      <div class="card__head">
        <div>
          <h2 style="font-size:1.0625rem;font-family:var(--font-body);font-weight:600">New password</h2>
          <p class="faint" style="font-size:.75rem">Confirm the current one first</p>
        </div>
        <span class="person" id="who"></span>
      </div>

      <div class="card__body">

        <!-- Only one alert is ever on screen; submitting clears both. -->
        <div class="chip" id="errbox" role="alert" hidden
             style="width:100%;align-items:flex-start;gap:var(--s2);background:var(--err-soft);border-color:transparent;color:var(--err-text);margin-bottom:var(--s4)"></div>
        <div class="chip" id="okbox" role="status" hidden
             style="width:100%;align-items:flex-start;gap:var(--s2);background:var(--ok-soft);border-color:transparent;color:var(--ok);margin-bottom:var(--s4)"></div>

        <!-- novalidate: the page paints the service's own refusals in
             the alert above rather than letting the browser bubble
             them, so the mockup shows the real error copy. -->
        <form id="pwform" novalidate>
          <div class="stack" style="gap:var(--s5)">

            <div class="field">
              <label class="label" for="cur">Current password <span class="req" aria-hidden="true">*</span></label>
              <div class="pwwrap">
                <input class="input" id="cur" name="cur" type="password" required
                       autocomplete="current-password" spellcheck="false">
                <button class="iconbtn" type="button" data-toggle="cur" data-label="current password"
                        aria-label="Show current password" aria-pressed="false"></button>
              </div>
            </div>

            <div class="field">
              <label class="label" for="npw">New password <span class="req" aria-hidden="true">*</span></label>
              <div class="pwwrap">
                <input class="input" id="npw" name="npw" type="password" required minlength="8"
                       autocomplete="new-password" spellcheck="false">
                <button class="iconbtn" type="button" data-toggle="npw" data-label="new password"
                        aria-label="Show new password" aria-pressed="false"></button>
              </div>
              <p class="help">Minimum 8 characters.</p>

              <div class="stack" style="gap:var(--s2);margin-top:var(--s2)">
                <div class="row row--between">
                  <span class="faint" style="font-size:.75rem">Strength</span>
                  <span class="faint mono" id="strengthlabel" style="font-size:.75rem" aria-live="polite">—</span>
                </div>
                <div class="meter"><div class="meter__fill" id="strengthfill" style="width:0%"></div></div>
              </div>

              <!-- Not aria-live: it would read out on every keystroke.
                   Each rule carries its state as text for screen
                   readers instead of relying on the tick's colour. -->
              <ul class="stack" id="rules" style="gap:var(--s2);margin-top:var(--s3);list-style:none;padding:0"></ul>

              <div class="row" style="margin-top:var(--s1)">
                <button class="btn btn--quiet btn--sm" type="button" id="blockedbtn">See the blocked list</button>
              </div>
            </div>

            <div class="field">
              <label class="label" for="cpw">Confirm new password <span class="req" aria-hidden="true">*</span></label>
              <div class="pwwrap">
                <input class="input" id="cpw" name="cpw" type="password" required
                       autocomplete="new-password" spellcheck="false">
                <button class="iconbtn" type="button" data-toggle="cpw" data-label="confirmed password"
                        aria-label="Show confirmed password" aria-pressed="false"></button>
              </div>
              <p class="err" id="matcherr" hidden></p>
            </div>

            <div class="row" style="gap:var(--s4)">
              <button class="btn btn--primary" type="submit">Update Password</button>
              <span class="faint" style="font-size:.75rem">Nothing is sent — this is a mockup.</span>
            </div>

          </div>
        </form>
      </div>
    </section>

    <!-- ------------------------------------------------ what happens after -->
    <section class="card">
      <div class="card__head">
        <div>
          <h2 style="font-size:1.0625rem;font-family:var(--font-body);font-weight:600">After you change it</h2>
          <p class="faint" style="font-size:.75rem">What the system does, and who to tell if it wasn’t you</p>
        </div>
      </div>
      <div class="card__body">
        <div class="stack" style="gap:var(--s4)" id="notes"></div>
        <hr class="rule" style="margin:var(--s5) 0">
        <div class="row row--wrap" style="gap:var(--s3)">
          <button class="btn btn--ghost btn--sm" type="button" id="hrbtn"></button>
          <a class="btn btn--quiet btn--sm" href="#"
             onclick="event.preventDefault();VHR.toast('Not in this mockup')">Read the security policy</a>
        </div>
      </div>
    </section>

  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  'use strict';
  var D = window.VHR_DATA, $ = function (id) { return document.getElementById(id); };

  var cur = $('cur'), npw = $('npw'), cpw = $('cpw'), form = $('pwform');

  /* ---- who is changing the password ---- */
  var initials = D.me.name.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
  $('who').innerHTML = '<span class="avatar">' + initials + '</span>' +
    '<span><span class="person__name" style="display:block">' + D.me.name + '</span>' +
    '<span class="person__meta">' + D.me.code + '</span></span>';

  /* The service refuses these outright. It is a server rule there;
     here it is checked as you type so the refusal is visible
     without a round trip that this mockup cannot make. */
  var BLOCKED = ['welcome@123', 'admin@123', 'password', 'password1', '12345678', 'changeme'];

  var RULES = [
    { text: 'At least 8 characters', test: function (v) { return v.length >= 8; } },
    { text: 'An upper and a lower case letter', test: function (v) { return /[a-z]/.test(v) && /[A-Z]/.test(v); } },
    { text: 'At least one number', test: function (v) { return /\d/.test(v); } },
    { text: 'At least one symbol', test: function (v) { return /[^A-Za-z0-9]/.test(v); } },
    { text: 'Not one of the blocked common passwords', test: function (v) { return !!v && BLOCKED.indexOf(v.toLowerCase()) === -1; } },
    { text: 'Different from your current password', test: function (v) { return !!v && v !== cur.value; } }
  ];

  function renderRules(v) {
    $('rules').innerHTML = RULES.map(function (r) {
      var pass = r.test(v);
      return '<li class="row" style="gap:var(--s3);align-items:flex-start">' +
        '<span class="stat__icon" style="width:1.25rem;height:1.25rem;border-radius:var(--r-full);flex:none;margin-top:.1rem;' +
        'background:var(--' + (pass ? 'ok-soft' : 'surface') + ');color:var(--' + (pass ? 'ok' : 'faint') + ')">' +
        VHR.icon(pass ? 'check' : 'x', 11) + '</span>' +
        '<span style="font-size:.8125rem;color:var(--' + (pass ? 'fg' : 'muted') + ')">' + r.text +
        '<span class="sr"> — ' + (pass ? 'met' : 'not met yet') + '</span></span></li>';
    }).join('');
  }

  /* Strength is the share of rules met, with a bonus for length —
     a long passphrase is stronger than a short string that happens
     to tick every box. */
  function paintStrength(v) {
    var met = 0;
    RULES.forEach(function (r) { if (r.test(v)) met++; });
    var pct = v ? Math.min(Math.round(met / RULES.length * 85) + (v.length >= 14 ? 15 : v.length >= 11 ? 8 : 0), 100) : 0;
    var label = !v ? '—' : pct < 45 ? 'Weak' : pct < 75 ? 'Fair' : pct < 95 ? 'Good' : 'Strong';
    var tone = !v ? '' : pct < 45 ? 'err' : pct < 75 ? 'warn' : '';
    $('strengthfill').className = 'meter__fill' + (tone ? ' meter__fill--' + tone : '');
    $('strengthfill').style.width = pct + '%';
    $('strengthlabel').textContent = label;
  }

  function checkMatch() {
    var bad = cpw.value.length > 0 && cpw.value !== npw.value;
    $('matcherr').hidden = !bad;
    if (bad) $('matcherr').innerHTML = VHR.icon('alert', 13) + ' New password and confirmation do not match';
    cpw.setAttribute('aria-invalid', String(bad));
  }

  function paint() { renderRules(npw.value); paintStrength(npw.value); checkMatch(); }

  cur.addEventListener('input', paint);
  npw.addEventListener('input', paint);
  cpw.addEventListener('input', checkMatch);
  paint();

  /* ---- eye toggles: three fields, three independent states ---- */
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function (btn) {
    var input = $(btn.getAttribute('data-toggle'));
    btn.innerHTML = VHR.icon('eye', 17);
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = VHR.icon(show ? 'eyeOff' : 'eye', 17);
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', (show ? 'Hide ' : 'Show ') + btn.getAttribute('data-label'));
    });
  });

  /* ---- alerts ---- */
  function fail(msg) {
    $('okbox').hidden = true;
    $('errbox').hidden = false;
    $('errbox').innerHTML = VHR.icon('alert', 15) + '<span>' + msg + '</span>';
    $('errbox').scrollIntoView({ block: 'nearest' });
  }
  function succeed() {
    $('errbox').hidden = true;
    $('okbox').hidden = false;
    $('okbox').innerHTML = VHR.icon('check', 15) +
      '<span>Password changed successfully. A security notice has been emailed to ' + D.me.email + '.</span>';
    form.reset();
    paint();
  }

  /* The gate runs before VHR.fakeSubmit's handler, so stopping the
     event here means the fake round trip never starts — the same
     order the real screen uses, where the mismatch is caught
     before anything is posted. */
  form.addEventListener('submit', function (e) {
    var a = cur.value, b = npw.value, c = cpw.value, msg = '';
    if (!a || !b) msg = 'Both current and new password are required';
    else if (b !== c) msg = 'New password and confirmation do not match';
    else if (b.length < 8) msg = 'Password must be at least 8 characters';
    else if (b.length > 200) msg = 'Password is too long';
    else if (BLOCKED.indexOf(b.toLowerCase()) !== -1) msg = 'That password is too common — please choose another';
    else if (b === a) msg = 'The new password must be different from the current one';

    if (msg) { e.preventDefault(); e.stopImmediatePropagation(); fail(msg); return; }

    $('errbox').hidden = true;
    $('okbox').hidden = true;
    /* fakeSubmit holds the button in its "Updating…" state for
       700ms; paint the green alert as that lands. */
    setTimeout(succeed, 780);
  });
  VHR.fakeSubmit(form, 'Password changed successfully');

  /* ---- the blocked list, in full ---- */
  $('blockedbtn').addEventListener('click', function () {
    VHR.modal({
      title: 'Blocked passwords',
      sub: 'Refused outright, whatever else they satisfy',
      body: '<ul class="stack" style="gap:var(--s2);list-style:none;padding:0">' +
        BLOCKED.map(function (p) {
          return '<li class="row" style="gap:var(--s3)">' +
            '<span class="stat__icon" style="width:1.25rem;height:1.25rem;border-radius:var(--r-full);flex:none;' +
            'background:var(--err-soft);color:var(--err-text)">' + VHR.icon('x', 11) + '</span>' +
            '<span class="mono" style="font-size:.8125rem">' + p + '</span></li>';
        }).join('') +
        '</ul><p class="help" style="margin-top:var(--s4)">Variations that only swap case are blocked too.</p>',
      foot: '<button class="btn btn--ghost" data-close>Close</button>'
    });
  });

  /* ---- after-the-change notes ---- */
  function fmt(d) {
    var p = d.split('-'), m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return p[2] + ' ' + m[+p[1] - 1] + ' ' + p[0];
  }
  var hr = D.employees.filter(function (e) { return e.designation === 'HR Manager'; })[0];
  var sec = D.policies.filter(function (p) { return p.name === 'IT & Security Policy'; })[0];

  var notes = [
    { icon: 'mail', text: 'A security notice goes to <span class="mono">' + D.me.email + '</span> the moment the password changes.' },
    { icon: 'shield', text: 'If that change was not yours, tell ' + hr.name + ' (' + hr.designation + ') straight away — do not wait for the shift to end.' },
    { icon: 'clock', text: 'Sessions idle for 15 minutes are signed out automatically. On the ' + D.me.shift + ' shift that covers the long gaps between builds.' },
    { icon: 'book', text: sec.name + ' ' + sec.version + ', updated ' + fmt(sec.updated) + ', covers device handling and incident reporting.' }
  ];

  $('notes').innerHTML = notes.map(function (n) {
    return '<div class="row" style="gap:var(--s3);align-items:flex-start">' +
      '<span class="stat__icon" style="width:1.75rem;height:1.75rem;flex:none">' + VHR.icon(n.icon, 14) + '</span>' +
      '<p class="muted" style="font-size:.8125rem">' + n.text + '</p></div>';
  }).join('');

  /* ---- HR contact ---- */
  $('hrbtn').innerHTML = VHR.icon('users', 15) + ' Contact ' + hr.name;
  $('hrbtn').addEventListener('click', function () {
    /* No phone icon in the set — the bell is the nearest. */
    var lines = [
      { icon: 'mail', label: 'Email', value: hr.email },
      { icon: 'bell', label: 'Phone', value: hr.phone },
      { icon: 'building', label: 'Sits in', value: hr.location + ' · ' + hr.department },
      { icon: 'badge', label: 'Employee code', value: hr.code }
    ];
    VHR.modal({
      title: hr.name,
      sub: hr.designation + ' · reachable through the night shift',
      body: '<div class="stack" style="gap:var(--s4)">' + lines.map(function (l) {
        return '<div class="row" style="gap:var(--s3)">' +
          '<span class="stat__icon" style="width:1.75rem;height:1.75rem;flex:none">' + VHR.icon(l.icon, 14) + '</span>' +
          '<span><span class="stat__label" style="display:block">' + l.label + '</span>' +
          '<span class="mono" style="font-size:.8125rem">' + l.value + '</span></span></div>';
      }).join('') + '</div>',
      foot: '<button class="btn btn--ghost" data-close>Close</button>'
    });
  });
})();
</script>
</body>
</html>
