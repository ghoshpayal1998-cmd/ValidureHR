<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees — ValidureHR</title>
<link rel="icon" href="../assets/brand/validure-mark.svg">
<link rel="stylesheet" href="../assets/css/vhr.css">
<script>try{var t=localStorage.getItem('vhr.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-root="../">

<main class="page" data-page>

  <div class="page__head">
    <div>
      <p class="eyebrow">Management</p>
      <h1 style="margin-top:var(--s2)">Employee Management</h1>
      <p class="muted" style="font-size:.875rem;margin-top:.25rem">Add, edit, search and manage employee accounts</p>
    </div>
    <div class="row" style="gap:var(--s3)">
      <button class="btn btn--primary" id="addbtn"></button>
    </div>
  </div>

  <div class="stack" style="gap:var(--s5)">

    <!-- ------------------------------------------------ result message slot -->
    <div id="alert" role="status" aria-live="polite" hidden></div>

    <!-- ------------------------------------------------ search + employee table -->
    <section class="card">
      <div class="filterbar">
        <div class="search">
          <label class="sr" for="q">Search employees</label>
          <span id="qicon"></span>
          <input class="input" id="q" type="search" autocomplete="off"
                 placeholder="Search by name, code, email or department…">
        </div>
        <div>
          <label class="sr" for="dept">Department</label>
          <select class="select" id="dept"></select>
        </div>
        <span class="spacer"></span>
        <p class="faint num" style="font-size:.75rem" id="count"></p>
      </div>

      <div class="card__body card__body--flush">
        <div class="tablewrap" id="tw">
          <table class="table">
            <thead>
              <tr>
                <th style="left:0;z-index:2;width:112px;min-width:112px;max-width:112px">Code</th>
                <th style="left:112px;z-index:2">Name</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Manager</th>
                <th>Status</th>
                <th>Login</th>
                <th class="num">Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <div class="card__foot">
        <p class="faint" style="font-size:.75rem">
          Ordered by employee code. Drag the table sideways — Code and Name stay pinned.
        </p>
      </div>
    </section>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  'use strict';
  var D = window.VHR_DATA, $ = function (id) { return document.getElementById(id); };

  /* The server clock is not IST, so the mockup states the date it is
     presenting rather than reading the visitor's clock. */
  var TODAY = '2026-09-21';
  var DOB_MAX = '2008-09-21';          /* today minus 18 years */

  /* data.js has no login state — this screen derives it the way the
     real system stores it: the account is disabled once the employee
     is off the payroll, and locked after five failed sign-ins. These
     two are the lockouts IT is sitting on this week. */
  var LOCKED = { 'VS-0131': true, 'VS-0164': true };

  /* -------------------------------------------------- date helpers
     Plain arithmetic on the ISO parts — no Date getters, which read
     the visitor's timezone and would shift a business date. */
  function pad(n) { return String(n).padStart(2, '0'); }
  function daysIn(y, m) {
    return [31, (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28,
      31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m];
  }
  function addMonths(iso, n) {
    var p = iso.split('-'), y = +p[0], m = +p[1] - 1 + n, d = +p[2];
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    var last = daysIn(y, m);
    return y + '-' + pad(m + 1) + '-' + pad(d > last ? last : d);
  }
  function dmy(iso) { if (!iso) return '—'; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  /* -------------------------------------------------- derived fields
     Role, probation and login state are not columns in data.js, so
     they are derived here rather than written back into it. */
  function roleFor(e) {
    if (/Lead$/.test(e.designation) || e.designation === 'Engineering Manager') return 'Team Lead';
    if (e.designation === 'HR Manager') return 'HR Manager';
    if (e.designation === 'Finance Executive') return 'Finance';
    return 'Employee';
  }
  function probationFor(e) {
    if (e.status !== 'Probation') return null;
    /* Six months from joining; a probation still open past its end
       date was extended by review, three months at a time. */
    var until = addMonths(e.joined, 6);
    while (until < TODAY) until = addMonths(until, 3);
    return until;
  }
  function derive(e) {
    var active = e.status !== 'Notice';
    return {
      code: e.code, first: e.first, last: e.last, name: e.name,
      email: e.email, phone: e.phone, joined: e.joined,
      department: e.department, designation: e.designation, manager: e.manager,
      role: roleFor(e), probation: probationFor(e),
      active: active, enabled: active, locked: !!LOCKED[e.code]
    };
  }

  var list = D.employees.map(derive).sort(function (a, b) { return a.code < b.code ? -1 : 1; });

  /* -------------------------------------------------- filters */
  var q = '', dept = '', timer = null;

  $('qicon').innerHTML = VHR.icon('search', 16);
  $('addbtn').innerHTML = VHR.icon('plus', 16) + 'Add Employee';
  $('dept').innerHTML = '<option value="">All departments</option>' +
    D.departments.map(function (d) { return '<option>' + d.name + '</option>'; }).join('');

  function visible() {
    return list.filter(function (r) {
      if (dept && r.department !== dept) return false;
      if (!q) return true;
      return [r.code, r.first, r.last, r.email, r.department].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  /* -------------------------------------------------- row rendering */
  function initials(name) {
    return name.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
  }
  function iconBtn(act, name, label, who, tone) {
    return '<button class="iconbtn" data-act="' + act + '" data-code="' + who.code + '" title="' + label +
      '" aria-label="' + label + ' — ' + who.name + '" style="color:var(--' + tone + ')">' +
      VHR.icon(name, 16) + '</button>';
  }
  function actionCell(r) {
    return '<div class="row" style="gap:var(--s1);justify-content:flex-end">' +
      iconBtn('photo', 'upload', 'Upload photo', r, 'muted') +
      iconBtn('edit', 'fileText', 'Edit', r, 'muted') +
      iconBtn('pw', 'key', 'Reset password', r, 'muted') +
      (r.locked ? iconBtn('unlock', 'shield', 'Unlock account', r, 'ok')
                : iconBtn('lock', 'shield', 'Lock account', r, 'warn')) +
      (r.enabled ? iconBtn('disable', 'logout', 'Disable login', r, 'muted')
                 : iconBtn('enable', 'logout', 'Enable login', r, 'ok')) +
      iconBtn('del', 'x', 'Delete employee', r, 'err-text') +
      '</div>';
  }
  function statusCell(r) {
    var s = '<span class="badge badge--' + (r.active ? 'ok' : 'err') + '">' +
      (r.active ? 'Active' : 'Inactive') + '</span>';
    if (!r.probation) return s;
    return s + '<div class="row" style="gap:var(--s2);margin-top:var(--s1)">' +
      '<span class="badge badge--warn">Probation → ' + dmy(r.probation) + '</span>' +
      '<button class="btn btn--quiet" data-act="endprob" data-code="' + r.code + '" ' +
      'title="End probation period immediately" aria-label="End probation for ' + r.name + '" ' +
      'style="height:auto;padding:0;font-size:.6875rem;color:var(--accent-strong)">Remove</button></div>';
  }
  function loginCell(r) {
    if (r.locked) return '<span class="badge badge--err">Locked</span>';
    return r.enabled ? '<span class="badge badge--ok">Enabled</span>'
                     : '<span class="badge badge--neutral">Disabled</span>';
  }

  var PIN1 = 'position:sticky;left:0;z-index:1;background:var(--raised);width:112px;min-width:112px;max-width:112px';
  var PIN2 = 'position:sticky;left:112px;z-index:1;background:var(--raised)';

  function render() {
    var rowsEl = $('rows'), shown = visible();

    $('count').textContent = 'Showing ' + shown.length + ' of ' + list.length + ' employees';

    if (!shown.length) {
      rowsEl.innerHTML = '<tr><td colspan="8"><div class="empty">' +
        '<div class="empty__icon">' + VHR.icon('users', 22) + '</div>' +
        '<h3>No employees found</h3>' +
        '<p>Nothing matches the current search and department filter. Clear them to bring the full list back.</p>' +
        '</div></td></tr>';
      syncDrag();
      return;
    }

    rowsEl.innerHTML = shown.map(function (r) {
      return '<tr>' +
        '<td data-pin="1" class="mono" style="' + PIN1 + ';font-weight:600">' + r.code + '</td>' +
        '<td data-pin="2" style="' + PIN2 + '"><span class="person">' +
          '<span class="avatar">' + initials(r.name) + '</span>' +
          '<span style="min-width:0">' +
            '<span class="row" style="gap:var(--s2)"><span class="person__name">' + r.name + '</span>' +
            (r.role === 'Employee' ? '' : '<span class="badge badge--info">' + r.role + '</span>') + '</span>' +
            '<span class="person__meta">' + r.email + '</span>' +
          '</span></span></td>' +
        '<td class="muted">' + (r.department || '—') + '</td>' +
        '<td class="muted">' + (r.designation || '—') + '</td>' +
        '<td class="muted">' + (r.manager || '—') + '</td>' +
        '<td>' + statusCell(r) + '</td>' +
        '<td>' + loginCell(r) + '</td>' +
        '<td class="num">' + actionCell(r) + '</td>' +
        '</tr>';
    }).join('');

    syncDrag();
  }

  function byCode(code) {
    for (var i = 0; i < list.length; i++) if (list[i].code === code) return list[i];
    return null;
  }

  /* -------------------------------------------------- result messages
     One slot under the page header: green clears itself after four
     seconds, red stays until the next action. */
  var alertTimer = null;
  function say(kind, msg) {
    var box = $('alert'), ink = kind === 'ok' ? 'ok' : 'err-text';
    box.innerHTML = '<div class="card" style="background:var(--' + kind + '-soft);border-color:var(--' + kind +
      ');box-shadow:none"><div class="card__body row" style="gap:var(--s3);color:var(--' + ink + ')">' +
      VHR.icon(kind === 'ok' ? 'check' : 'alert', 18) +
      '<span style="font-size:.875rem;font-weight:600">' + msg + '</span></div></div>';
    box.hidden = false;
    clearTimeout(alertTimer);
    if (kind === 'ok') alertTimer = setTimeout(function () { box.hidden = true; box.innerHTML = ''; }, 4000);
  }

  /* -------------------------------------------------- form scaffolding */
  function field(id, label, control, help, req, full) {
    return '<div class="field"' + (full ? ' style="grid-column:1/-1"' : '') + '>' +
      '<label class="label" for="' + id + '">' + label + (req ? '<span class="req">*</span>' : '') + '</label>' +
      control + (help ? '<p class="help">' + help + '</p>' : '') + '</div>';
  }
  function options(items, firstLabel, selected) {
    return '<option value="">' + firstLabel + '</option>' + items.map(function (v) {
      return '<option' + (v === selected ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  }
  function managerOptions(exclude, selected) {
    var opts = list.filter(function (r) { return r.active && r.code !== exclude; })
      .map(function (r) { return r.code + ' — ' + r.name; });
    if (!opts.length) return '<option value="">No employees yet</option>';
    return '<option value="">—</option>' + opts.map(function (v) {
      return '<option' + (v.indexOf(selected) === 6 ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  }
  function footRow(submitLabel) {
    return '<div class="row" style="grid-column:1/-1;justify-content:flex-end;gap:var(--s3);padding-top:var(--s2)">' +
      '<button class="btn btn--ghost" type="button" data-close>Cancel</button>' +
      '<button class="btn btn--primary" type="submit">' + submitLabel + '</button></div>';
  }

  /* -------------------------------------------------- add / edit employee */
  function employeeModal(r) {
    var edit = !!r, e = r || {};
    var body = '<form id="empform" class="fieldrow">' +
      field('f-code', 'Employee Code', '<input class="input" id="f-code" name="code" placeholder="VS-0173" ' +
        'value="' + (e.code || '') + '"' + (edit ? ' disabled' : ' required') + '>', '', true) +
      field('f-status', 'Status', '<select class="select" id="f-status" name="status">' +
        '<option' + (!edit || e.active ? ' selected' : '') + '>Active</option>' +
        '<option' + (edit && !e.active ? ' selected' : '') + '>Inactive</option></select>', '', false) +
      field('f-first', 'First Name', '<input class="input" id="f-first" name="first" required value="' +
        (e.first || '') + '">', '', true) +
      field('f-last', 'Last Name', '<input class="input" id="f-last" name="last" required value="' +
        (e.last || '') + '">', '', true) +
      field('f-email', 'Email', '<input class="input" id="f-email" name="email" type="email" required value="' +
        (e.email || '') + '">', '', true) +
      field('f-phone', 'Phone', '<input class="input" id="f-phone" name="phone" value="' +
        (e.phone || '') + '">', '', false) +
      field('f-emg', 'Emergency Contact (optional)',
        '<input class="input" id="f-emg" name="emergency" placeholder="e.g. 9876543210">', '', false) +
      field('f-doj', 'Date of Joining', '<input class="input" id="f-doj" name="doj" type="date" required value="' +
        (e.joined || '') + '">', '', true) +
      field('f-dob', 'Date of Birth (must be 18+)',
        '<input class="input" id="f-dob" name="dob" type="date" required max="' + DOB_MAX + '">',
        'Anyone born after ' + dmy(DOB_MAX) + ' is under 18 and will be rejected.', true) +
      field('f-dept', 'Department', '<select class="select" id="f-dept" name="department">' +
        options(D.departments.map(function (d) { return d.name; }), 'None / Select department', e.department) +
        '</select>', '', false) +
      field('f-desig', 'Designation', '<select class="select" id="f-desig" name="designation">' +
        options(D.designations, 'None / Select designation', e.designation) + '</select>', '', false) +
      field('f-mgr', 'Reporting Manager', '<select class="select" id="f-mgr" name="manager">' +
        managerOptions(e.code, e.manager || '') + '</select>',
        'Any employee can be a manager — add the manager as an employee first, then select them here.', false) +
      '<div class="field">' +
        '<label class="label" for="f-prob">Probation Until (optional)</label>' +
        '<div class="row" style="gap:var(--s2)">' +
          '<input class="input" id="f-prob" name="probation" type="date" value="' + (e.probation || '') + '">' +
          '<button class="btn btn--ghost btn--sm" type="button" id="probclear" title="Remove probation">Clear</button>' +
        '</div>' +
        '<p class="help">While on probation: unpaid leave only, leave balance locked (no accrual, no deduction).</p>' +
      '</div>' +
      field('f-pan', 'PAN Number (optional)', '<input class="input mono" id="f-pan" name="pan">', '', false) +
      field('f-bank', 'Bank Name (optional)', '<input class="input" id="f-bank" name="bank">', '', false) +
      field('f-acc', 'Bank Account No. (optional)', '<input class="input mono" id="f-acc" name="account">', '', false) +
      field('f-ifsc', 'Bank IFSC (optional)', '<input class="input mono" id="f-ifsc" name="ifsc">', '', false) +
      field('f-role', 'User Role', '<select class="select" id="f-role" name="role">' +
        '<option value="Employee">Employee (default)</option>' +
        D.roles.filter(function (x) { return x.name !== 'Employee'; }).map(function (x) {
          return '<option' + (x.name === e.role ? ' selected' : '') + '>' + x.name + '</option>';
        }).join('') + '</select>',
        'HR Manager and Team Lead can approve leave. Custom roles are defined by the admin in Roles &amp; Access.', false) +
      (edit ? '' : '<p class="help" style="grid-column:1/-1">A login account is created automatically ' +
        '(username = employee code) with a randomly generated temporary password, which is emailed to the ' +
        'employee. They are required to change it at first login.</p>') +
      footRow('Save Employee') +
      '</form>';

    var close = VHR.modal({
      title: edit ? 'Edit Employee' : 'Add Employee',
      sub: edit ? r.code + ' · ' + r.name : 'A login account is created for the new joiner.',
      body: body, foot: null, wide: true
    });

    var form = $('empform');
    $('probclear').addEventListener('click', function () { $('f-prob').value = ''; });

    /* In add mode a date of joining pre-fills probation with the
       company default of six months, while the field is untouched. */
    if (!edit) $('f-doj').addEventListener('change', function () {
      if (this.value && !$('f-prob').value) $('f-prob').value = addMonths(this.value, 6);
    });

    VHR.fakeSubmit(form, edit ? 'Employee updated' : 'Employee created');
    form.addEventListener('submit', function () {
      var v = function (id) { return $(id).value.trim(); };
      var name = v('f-first') + ' ' + v('f-last');
      var active = $('f-status').value === 'Active';
      var mgr = $('f-mgr').value ? $('f-mgr').value.split(' — ')[1] : '—';
      setTimeout(function () {
        if (edit) {
          var row = byCode(r.code);
          row.first = v('f-first'); row.last = v('f-last'); row.name = name;
          row.email = v('f-email'); row.phone = v('f-phone'); row.joined = v('f-doj');
          row.department = $('f-dept').value; row.designation = $('f-desig').value;
          row.manager = mgr; row.role = $('f-role').value;
          row.probation = v('f-prob') || null;
          row.active = active; if (!active) row.enabled = false;
          say('ok', 'Employee updated');
        } else {
          list.push({
            code: v('f-code'), first: v('f-first'), last: v('f-last'), name: name,
            email: v('f-email'), phone: v('f-phone'), joined: v('f-doj'),
            department: $('f-dept').value, designation: $('f-desig').value,
            manager: mgr, role: $('f-role').value, probation: v('f-prob') || null,
            active: active, enabled: active, locked: false
          });
          list.sort(function (a, b) { return a.code < b.code ? -1 : 1; });
          say('ok', 'Employee created — credentials emailed to ' + v('f-email'));
        }
        render();
        close();
      }, 760);
    });
  }

  /* -------------------------------------------------- reset password */
  function passwordModal(r) {
    var COMMON = ['welcome@123', 'admin@123', 'password', 'password1', '12345678', 'changeme'];
    var body = '<form id="pwform" class="stack" style="gap:var(--s4)" novalidate>' +
      '<p class="muted" style="font-size:.875rem">Set a new password for <strong>' + r.name +
        '</strong> (<span class="mono">' + r.code + '</span>).</p>' +
      '<div class="field">' +
        '<label class="label" for="f-pw">New password<span class="req">*</span></label>' +
        '<div class="pwwrap">' +
          '<input class="input mono" id="f-pw" type="password" autocomplete="new-password" ' +
          'placeholder="At least 8 characters">' +
          '<button class="iconbtn" type="button" id="pweye" aria-label="Show password">' +
          VHR.icon('eye', 18) + '</button>' +
        '</div>' +
        '<p class="err" id="pwerr" hidden></p>' +
        '<p class="help">The new password is emailed to the employee automatically, and you can reveal it here ' +
        'to pass on by hand if the mail does not arrive. Common defaults such as <span class="mono">Welcome@123</span> ' +
        'are rejected. The employee must change it at first login, and any lockout is cleared.</p>' +
      '</div>' +
      footRow('Reset Password') +
      '</form>';

    var close = VHR.modal({ title: 'Reset Password', sub: r.email, body: body, foot: null });
    var form = $('pwform'), input = $('f-pw'), err = $('pwerr'), shown = false;

    $('pweye').addEventListener('click', function () {
      shown = !shown;
      input.type = shown ? 'text' : 'password';
      this.innerHTML = VHR.icon(shown ? 'eyeOff' : 'eye', 18);
      this.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
    });

    function fail(msg) {
      err.innerHTML = VHR.icon('alert', 14) + '<span>' + msg + '</span>';
      err.hidden = false;
      input.setAttribute('aria-invalid', 'true');
      input.focus();
    }

    /* Registered before fakeSubmit so a rejected password never
       reaches the spinner. */
    form.addEventListener('submit', function (e) {
      var val = input.value;
      if (val.length < 8) { e.preventDefault(); e.stopImmediatePropagation(); fail('Password must be at least 8 characters.'); return; }
      if (COMMON.indexOf(val.toLowerCase()) !== -1) { e.preventDefault(); e.stopImmediatePropagation(); fail('That password is too common — please choose another.'); return; }
      err.hidden = true;
      input.removeAttribute('aria-invalid');
    });

    VHR.fakeSubmit(form, 'Password reset');
    form.addEventListener('submit', function () {
      setTimeout(function () {
        var row = byCode(r.code);
        if (row) row.locked = false;
        render();
        say('ok', 'Password reset for ' + r.code + ' — emailed to ' + r.email);
        close();
      }, 760);
    });
  }

  /* -------------------------------------------------- upload photo */
  function photoModal(r) {
    var body = '<form id="photoform" class="stack" style="gap:var(--s4)">' +
      '<p class="muted" style="font-size:.875rem">Upload a profile photo for <strong>' + r.name + '</strong>.</p>' +
      field('f-photo', 'Photo file',
        '<input class="input" id="f-photo" type="file" required ' +
        'accept="image/jpeg,image/png,image/webp,image/heic">',
        'JPG, PNG, WebP or HEIC. A square image crops best into the avatar.', true) +
      footRow('Upload Photo') +
      '</form>';

    var close = VHR.modal({ title: 'Upload Employee Photo', sub: r.code + ' · ' + r.name, body: body, foot: null });
    var form = $('photoform');
    VHR.fakeSubmit(form, 'Photo uploaded');
    form.addEventListener('submit', function () {
      setTimeout(function () { say('ok', 'Photo uploaded successfully'); close(); }, 760);
    });
  }

  /* -------------------------------------------------- destructive confirms */
  function deleteModal(r) {
    var close = VHR.modal({
      title: 'Delete employee',
      sub: r.code + ' · ' + r.name,
      body: '<p style="font-size:.875rem">Delete <strong>' + r.code + ' (' + r.name + ')</strong> and all of ' +
        'their records? This cannot be undone.</p>' +
        '<p class="muted" style="font-size:.8125rem">Their attendance, leave applications, leave balances and ' +
        'ledger, salary slips, offer letters and login account are removed, and they are cleared as anyone ' +
        'else&rsquo;s reporting manager.</p>',
      foot: '<button class="btn btn--ghost" data-close>Cancel</button>' +
        '<button class="btn btn--danger" data-ok>Delete employee</button>',
      onOk: function () {
        list = list.filter(function (x) { return x.code !== r.code; });
        render();
        say('ok', 'Employee deleted');
        close();
      }
    });
  }

  function probationModal(r) {
    var close = VHR.modal({
      title: 'End probation',
      sub: r.code + ' · ' + r.name,
      body: '<p style="font-size:.875rem">Confirm ending probation for <strong>' + r.name + '</strong>?</p>' +
        '<p class="muted" style="font-size:.8125rem">Probation currently runs to ' + dmy(r.probation) +
        '. Ending it now unlocks the leave balance and restarts accrual from this month.</p>',
      foot: '<button class="btn btn--ghost" data-close>Cancel</button>' +
        '<button class="btn btn--primary" data-ok>End probation</button>',
      onOk: function () {
        var row = byCode(r.code);
        if (row) row.probation = null;
        render();
        say('ok', 'Probation ended for ' + r.name);
        close();
      }
    });
  }

  /* -------------------------------------------------- row actions */
  $('rows').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var r = byCode(btn.getAttribute('data-code'));
    if (!r) return;
    var act = btn.getAttribute('data-act');

    if (act === 'photo') return photoModal(r);
    if (act === 'edit') return employeeModal(r);
    if (act === 'pw') return passwordModal(r);
    if (act === 'del') return deleteModal(r);
    if (act === 'endprob') return probationModal(r);

    /* Lock, unlock, enable and disable take effect on the first
       click — the real screen does not confirm them either. */
    if (act === 'lock' || act === 'unlock') {
      r.locked = act === 'lock';
      say('ok', 'Account ' + (r.locked ? 'locked' : 'unlocked') + ' for ' + r.code);
      VHR.toast('Account ' + (r.locked ? 'locked' : 'unlocked') + ' for ' + r.code, 'ok');
    } else {
      r.enabled = act === 'enable';
      say('ok', 'Account ' + (r.enabled ? 'enabled' : 'disabled') + ' for ' + r.code);
      VHR.toast('Account ' + (r.enabled ? 'enabled' : 'disabled') + ' for ' + r.code, 'ok');
    }
    render();
  });

  $('addbtn').addEventListener('click', function () { employeeModal(null); });

  /* -------------------------------------------------- search */
  $('q').addEventListener('input', function () {
    var val = this.value.trim().toLowerCase();
    clearTimeout(timer);
    timer = setTimeout(function () { q = val; render(); }, 250);
  });
  $('dept').addEventListener('change', function () { dept = this.value; render(); });

  /* -------------------------------------------------- pinned columns
     The two frozen cells carry their own background, so the row
     hover has to be painted onto them by hand. */
  var tw = $('tw');
  function paintPins(target, bg) {
    var tr = target && target.closest ? target.closest('tr') : null;
    if (!tr) return;
    Array.prototype.forEach.call(tr.querySelectorAll('[data-pin]'), function (td) { td.style.background = bg; });
  }
  $('rows').addEventListener('mouseover', function (e) { paintPins(e.target, 'var(--bg)'); });
  $('rows').addEventListener('mouseout', function (e) { paintPins(e.target, 'var(--raised)'); });

  function shadow() {
    var on = tw.scrollLeft > 0;
    Array.prototype.forEach.call(tw.querySelectorAll('[data-pin="2"]'), function (td) {
      td.style.boxShadow = on ? '6px 0 8px -6px var(--line-strong)' : '';
    });
  }
  tw.addEventListener('scroll', shadow);

  /* -------------------------------------------------- drag to scroll
     The table is wider than the viewport by design; grabbing any
     non-interactive part of it scrolls sideways. A drag of more than
     three pixels swallows the click so no row button fires. */
  var down = false, startX = 0, startLeft = 0, moved = 0;
  function wide() { return tw.scrollWidth > tw.clientWidth; }
  function syncDrag() { tw.style.cursor = wide() ? 'grab' : ''; shadow(); }

  tw.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || !wide()) return;
    if (e.target.closest && e.target.closest('button,a,input,select,textarea,label')) return;
    down = true; moved = 0; startX = e.clientX; startLeft = tw.scrollLeft;
    tw.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function (e) {
    if (!down) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > moved) moved = Math.abs(dx);
    tw.scrollLeft = startLeft - dx;
  });
  document.addEventListener('mouseup', function () {
    if (!down) return;
    down = false;
    tw.style.cursor = wide() ? 'grab' : '';
  });
  tw.addEventListener('click', function (e) {
    if (moved > 3) { e.preventDefault(); e.stopPropagation(); moved = 0; }
  }, true);
  window.addEventListener('resize', syncDrag);

  render();
})();
</script>
</body>
</html>
