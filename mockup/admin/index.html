<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — ValidureHR</title>
<link rel="icon" href="../assets/brand/validure-mark.svg">
<link rel="stylesheet" href="../assets/css/vhr.css">
<script>try{var t=localStorage.getItem('vhr.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-root="../">

<main class="page" data-page>

  <div class="page__head">
    <div>
      <p class="eyebrow">Management</p>
      <h1 style="margin-top:var(--s2)">Overview</h1>
      <p class="muted" style="font-size:.875rem;margin-top:.25rem" id="sub">Company snapshot for 21/09/2026</p>
    </div>
    <div class="row" style="gap:var(--s3)">
      <!-- page actions: the spec puts no buttons here, only the idle-timeout note -->
      <span class="chip" id="idlenote"></span>
    </div>
  </div>

  <div class="stack" style="gap:var(--s5)">

    <!-- ------------------------------------------------ headline counters -->
    <div class="grid grid--4" id="stats"></div>

    <!-- ------------------------------------------------ three panels -->
    <div class="grid grid--3">

      <!-- column 1: today's attendance, then department strength -->
      <section class="card">
        <div class="card__body">
          <h2 style="font-size:1.0625rem;font-family:var(--font-body);font-weight:600">Today’s attendance</h2>
          <p class="faint" style="font-size:.75rem;margin-bottom:var(--s4)">Shift of 21/09/2026 · 19:00 – 04:00 IST</p>
          <div id="today"></div>

          <hr class="rule" style="margin:var(--s5) 0">

          <h3 style="font-size:.9375rem;font-family:var(--font-body);font-weight:600">Department strength</h3>
          <p class="faint" style="font-size:.75rem;margin-bottom:var(--s4)">Active employees only, largest first</p>
          <div id="depts"></div>
        </div>
      </section>

      <!-- column 2: the approval queue -->
      <section class="card">
        <div class="card__head">
          <div>
            <h2 style="font-size:1.0625rem;font-family:var(--font-body);font-weight:600">Leave requests awaiting approval</h2>
            <p class="faint" style="font-size:.75rem">Newest application first</p>
          </div>
          <a class="btn btn--quiet btn--sm" href="leaves.html">View all →</a>
        </div>
        <div class="card__body" id="pending"></div>
      </section>

      <!-- column 3: the audit feed -->
      <section class="card">
        <div class="card__head">
          <div>
            <h2 style="font-size:1.0625rem;font-family:var(--font-body);font-weight:600">Recent activity</h2>
            <p class="faint" style="font-size:.75rem">Audit log · 8 most recent entries</p>
          </div>
        </div>
        <div class="card__body" id="audit"></div>
      </section>

    </div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  'use strict';
  var D = window.VHR_DATA, $ = function (id) { return document.getElementById(id); };

  /* The server clock is not IST, so the mockup states the date it is
     presenting rather than reading the visitor's clock. */
  var TODAY = '2026-09-21';

  $('sub').textContent = 'Company snapshot for 21/09/2026 · ' + D.me.company;
  $('idlenote').innerHTML = VHR.icon('clock', 14) + '<span>Signs out after 15 minutes idle</span>';

  /* ---- date helpers ---- */
  function dmy(iso) {                       /* '2026-09-24' -> '24/09/2026' */
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function stamp(at) {                      /* '2026-09-21 20:14' -> '21/09/2026 20:14' */
    var p = at.split(' ');
    return dmy(p[0]) + ' ' + (p[1] || '');
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---- headline counters ------------------------------------------- */
  var active = D.employees.filter(function (e) { return e.status === 'Active'; });
  var pending = D.leaveRequests.filter(function (l) { return l.status === 'Pending'; })
    .sort(function (a, b) { return a.applied < b.applied ? 1 : -1; });

  var cards = [
    { label: 'Total employees', val: D.employees.length, icon: 'users', tone: 'accent' },
    { label: 'Active employees', val: active.length, icon: 'check', tone: 'ok' },
    { label: 'Departments', val: D.departments.length, icon: 'building', tone: 'info' },
    { label: 'Pending leave requests', val: pending.length, icon: 'clipboardCheck', tone: 'warn' }
  ];

  $('stats').innerHTML = cards.map(function (c) {
    return '<section class="card"><div class="stat">' +
      '<div class="row" style="gap:var(--s4)">' +
        '<span class="stat__icon" style="background:var(--' + c.tone + '-soft);color:var(--' + c.tone + ')">' +
        VHR.icon(c.icon, 20) + '</span>' +
        '<div style="min-width:0">' +
          '<p class="stat__label">' + c.label + '</p>' +
          '<p class="stat__val num" style="margin-top:var(--s2)">' + c.val + '</p>' +
        '</div>' +
      '</div></div></section>';
  }).join('');

  /* ---- today's attendance ------------------------------------------
     Fixed display order; a status with no one in it is left out
     rather than shown as a zero. */
  var t = D.todayAttendance;
  var order = [
    { label: 'Present', n: t.present, tone: 'ok' },
    { label: 'Work from home', n: t.wfh, tone: 'info' },
    { label: 'Half day', n: t.halfDay || 0, tone: 'warn' },
    { label: 'On leave', n: t.onLeave, tone: 'neutral' },
    { label: 'Absent', n: t.absent, tone: 'err' },
    { label: 'Holiday', n: t.holiday || 0, tone: 'info' },
    { label: 'Weekend', n: t.weekend || 0, tone: 'neutral' }
  ].filter(function (s) { return s.n > 0; });

  $('today').innerHTML = order.length
    ? '<ul class="stack" style="list-style:none;padding:0;gap:var(--s3)">' +
        order.map(function (s) {
          return '<li class="row row--between" style="gap:var(--s3)">' +
            '<span class="badge badge--' + s.tone + '">' + s.label + '</span>' +
            '<span class="num" style="font-size:.875rem;font-weight:600">' + s.n + '</span></li>';
        }).join('') +
      '</ul>' +
      '<p class="faint" style="font-size:.75rem;margin-top:var(--s4)">' +
        '<span class="mono">' + t.late + '</span> late marks · ' +
        '<span class="mono">' + t.notPunched + '</span> yet to punch in · ' +
        '<span class="mono">' + t.total + '</span> on the roll</p>'
    : '<div class="empty"><span class="empty__icon">' + VHR.icon('calendarClock', 22) + '</span>' +
      '<h3>No attendance records for today</h3>' +
      '<p>Punches appear here once the biometric readers sync for the 21/09/2026 shift.</p></div>';

  /* ---- department strength -----------------------------------------
     Derived from the employee roll, not from departments[].count, so
     the bars and the total can never disagree with each other. */
  var known = {};
  D.departments.forEach(function (d) { known[d.name] = d.head; });

  var tally = {}, unassigned = 0;
  active.forEach(function (e) {
    if (e.department && known.hasOwnProperty(e.department)) {
      tally[e.department] = (tally[e.department] || 0) + 1;
    } else { unassigned++; }
  });

  var rows = Object.keys(tally).map(function (name) {
    return { name: name, head: known[name], n: tally[name], odd: false };
  }).sort(function (a, b) { return b.n - a.n || (a.name < b.name ? -1 : 1); });

  if (unassigned > 0) {
    rows.push({ name: 'Unassigned', head: 'no department set', n: unassigned, odd: true });
  }

  var peak = rows.reduce(function (m, r) { return Math.max(m, r.n); }, 0) || 1;
  var headcount = rows.reduce(function (s, r) { return s + r.n; }, 0);

  $('depts').innerHTML = rows.length
    ? '<ul class="stack" style="list-style:none;padding:0;gap:var(--s3)">' +
        rows.map(function (r) {
          var pct = Math.round((r.n / peak) * 100);
          var nameStyle = 'font-size:.875rem;min-width:0' +
            (r.odd ? ';color:var(--warn);font-style:italic' : '');
          var headStyle = 'font-size:.75rem' + (r.odd ? ';color:var(--warn)' : '');
          return '<li style="display:grid;gap:var(--s2)">' +
            '<div class="row row--between" style="gap:var(--s3)">' +
              '<span style="' + nameStyle + '">' + esc(r.name) +
                ' <span class="faint" style="' + headStyle + '">· ' + esc(r.head) + '</span></span>' +
              '<span class="num" style="font-size:.875rem;font-weight:600">' + r.n + '</span>' +
            '</div>' +
            '<div class="meter"><div class="meter__fill' + (r.odd ? ' meter__fill--warn' : '') +
              '" style="width:' + pct + '%"></div></div>' +
          '</li>';
        }).join('') +
        '<li class="row row--between" style="gap:var(--s3);border-top:1px solid var(--line);padding-top:var(--s3)">' +
          '<span style="font-size:.875rem;font-weight:600">Total (active)</span>' +
          '<span class="num" style="font-size:.875rem;font-weight:700">' + headcount + '</span></li>' +
      '</ul>'
    : '<div class="empty"><span class="empty__icon">' + VHR.icon('building', 22) + '</span>' +
      '<h3>No departments yet</h3>' +
      '<p>Add a department in Settings and the head-count bars will fill in here.</p></div>';

  /* ---- leave requests awaiting approval -----------------------------
     'Pending' is relabelled for the approver's queue; the short leave
     code comes from leaveTypes so the two never drift apart. */
  var codeOf = {};
  D.leaveTypes.forEach(function (lt) { codeOf[lt.name] = lt.code; });

  $('pending').innerHTML = pending.length
    ? '<ul class="stack" style="list-style:none;padding:0;gap:var(--s3)">' +
        pending.slice(0, 6).map(function (r, i) {
          return '<li><button class="card" data-req="' + i + '" ' +
            'style="box-shadow:none;display:block;width:100%;text-align:left;padding:var(--s3)">' +
            '<span class="row row--between" style="gap:var(--s3)">' +
              '<span style="min-width:0"><span style="font-size:.875rem;font-weight:600">' + esc(r.emp) + '</span> ' +
              '<span class="faint mono" style="font-size:.75rem">(' + esc(r.code) + ')</span></span>' +
              '<span class="badge badge--warn">Awaiting approval</span>' +
            '</span>' +
            '<span class="faint mono" style="display:block;font-size:.75rem;margin-top:.25rem">' +
              (codeOf[r.type] || r.type) + ' · ' + dmy(r.from) + ' → ' + dmy(r.to) + ' (' + r.days + 'd)' +
            '</span></button></li>';
        }).join('') +
      '</ul>' +
      (pending.length > 6
        ? '<p class="faint" style="font-size:.75rem;margin-top:var(--s4)">Showing 6 of ' +
          pending.length + ' — the rest are in Leave Management.</p>'
        : '')
    : '<div class="empty"><span class="empty__icon">' + VHR.icon('check', 22) + '</span>' +
      '<h3>No pending requests</h3>' +
      '<p>Everything has been actioned. New applications land here the moment they are filed.</p></div>';

  /* A request opens read-only detail; approving and rejecting belong
     to Leave Management, so this screen never mutates anything. */
  Array.prototype.forEach.call($('pending').querySelectorAll('[data-req]'), function (btn) {
    btn.addEventListener('click', function () {
      var r = pending[+btn.getAttribute('data-req')];
      function line(k, v) {
        return '<div class="row row--between" style="gap:var(--s4);align-items:flex-start">' +
          '<span class="faint" style="font-size:.75rem">' + k + '</span>' +
          '<span style="font-size:.875rem;text-align:right">' + v + '</span></div>';
      }
      VHR.modal({
        title: 'Leave request #' + r.id,
        sub: r.emp + ' · ' + r.code,
        body: '<div class="stack" style="gap:var(--s3)">' +
          line('Leave type', esc(r.type) + ' <span class="mono faint">(' + (codeOf[r.type] || '—') + ')</span>') +
          line('Dates', '<span class="mono">' + dmy(r.from) + ' → ' + dmy(r.to) + '</span>') +
          line('Working days', '<span class="num">' + r.days + '</span>') +
          line('Applied on', '<span class="mono">' + dmy(r.applied) + '</span>') +
          line('Approver', esc(r.approver)) +
          '<hr class="rule">' +
          '<div><p class="faint" style="font-size:.75rem">Reason given</p>' +
          '<p style="font-size:.875rem;margin-top:.25rem">' + esc(r.reason) + '</p></div>' +
          '</div>',
        foot: '<button class="btn btn--ghost" data-close>Close</button>' +
          '<a class="btn btn--primary" href="leaves.html">Open in Leave Management</a>'
      });
    });
  });

  /* ---- recent activity ---------------------------------------------
     Action codes are stored dotted (leave.approve) and shown in the
     upper snake case the audit table uses. */
  var runs = {};
  D.payrollRuns.forEach(function (p) { runs[p.period] = p; });

  var feed = D.audit.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).slice(0, 8);

  $('audit').innerHTML = feed.length
    ? '<ul class="stack" style="list-style:none;padding:0;gap:var(--s4)">' +
        feed.map(function (a) {
          var code = a.action.replace(/\./g, '_').toUpperCase();
          var who = a.who === 'Rahul Paul' ? a.who + ' (platform admin)' : a.who;
          var meta = stamp(a.at) + (a.ip && a.ip !== '-' ? ' · ' + a.ip : '');

          /* A payroll entry is far easier to read with the run's
             figures attached than with the period alone. */
          var extra = '';
          if (a.action.indexOf('payroll.') === 0) {
            var run = runs[a.target.replace(/ run$/, '')];
            if (run) {
              extra = '<p class="faint mono" style="font-size:.6875rem;margin-top:.15rem">' +
                'net ' + VHR.money(run.net) + ' · ' + run.headcount + ' employees · ' + run.status + '</p>';
            }
          }

          return '<li style="padding-left:var(--s3);border-left:2px solid var(--line)">' +
            '<p class="mono" style="font-size:.8125rem;font-weight:600">' + code + '</p>' +
            '<p class="muted" style="font-size:.75rem;margin-top:.1rem">' + esc(a.target) + '</p>' + extra +
            '<p class="faint mono" style="font-size:.6875rem;margin-top:.15rem">' + esc(who) + ' · ' + meta + '</p>' +
          '</li>';
        }).join('') +
      '</ul>'
    : '<div class="empty"><span class="empty__icon">' + VHR.icon('history', 22) + '</span>' +
      '<h3>Nothing logged yet</h3>' +
      '<p>Approvals, edits and exports are recorded here with the actor and the time.</p></div>';
})();
</script>
</body>
</html>
