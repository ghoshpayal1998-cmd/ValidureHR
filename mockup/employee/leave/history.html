<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave History — ValidureHR</title>
<link rel="icon" href="../../assets/brand/validure-mark.svg">
<link rel="stylesheet" href="../../assets/css/vhr.css">
<script>try{var t=localStorage.getItem('vhr.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-root="../../">

<main class="page" data-page>

  <div class="page__head">
    <div>
      <p class="eyebrow">Leave</p>
      <h1 style="margin-top:var(--s2)">Leave History</h1>
      <p class="muted" style="font-size:.875rem;margin-top:.25rem">All leave applications and their status — pending ones can be edited or cancelled</p>
    </div>
  </div>

  <div class="stack" style="gap:var(--s5)">

    <!-- ------------------------------------------------ alert rail
         One host for both tones: errors stay until dismissed, the
         success message clears itself after four seconds. -->
    <div id="alert" hidden></div>

    <!-- ------------------------------------------------ applications -->
    <section class="card">
      <div class="card__head">
        <div>
          <h2 style="font-size:1.0625rem;font-family:var(--font-body);font-weight:600">Applications</h2>
          <p class="faint" style="font-size:.75rem" id="subline">Newest applied first</p>
        </div>
        <span class="chip" id="count">—</span>
      </div>
      <div class="card__body card__body--flush">
        <div class="tablewrap">
          <table class="table">
            <thead>
              <tr>
                <th>Applied</th>
                <th>Type</th>
                <th>Dates</th>
                <th class="num">Days</th>
                <th>Document</th>
                <th>Status</th>
                <th>Decided By</th>
                <th>Decision Date</th>
                <th>Rejection Reason</th>
                <th><span class="sr">Row actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>
</main>

<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/shell.js"></script>
<script>
(function () {
  'use strict';
  var D = window.VHR_DATA, $ = function (id) { return document.getElementById(id); };

  /* ---- dates ----------------------------------------------------
     Business dates are parsed as UTC on purpose. The demo host does
     not run on IST, and a local-time Date() would slide a leave day
     across the midnight the night shift already straddles. */
  function parse(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function keyOf(d) {
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dmy(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function fmt(s) {
    var p = s.split('-'), m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return p[2] + ' ' + m[+p[1] - 1] + ' ' + p[0];
  }

  var holiday = {};
  D.holidays.forEach(function (h) { holiday[h.date] = h.name; });

  /* Weekends and declared holidays are not leave days — the count in
     the edit modal has to agree with what payroll would deduct. */
  function workingDays(from, to) {
    var d = parse(from), end = parse(to), n = 0;
    if (end < d) return 0;
    while (d <= end) {
      var wd = d.getUTCDay();
      if (wd !== 0 && wd !== 6 && !holiday[keyOf(d)]) n++;
      d.setUTCDate(d.getUTCDate() + 1);
    }
    return n;
  }

  /* ---- derived fields data.js does not carry --------------------- */
  var byName = {};
  D.employees.forEach(function (e) { byName[e.name] = e; });

  /* The approver's role comes off the employee record, so the column
     reads 'Vikram Rao (Engineering Manager)' without a second list. */
  function decidedBy(r) {
    if (r.status === 'Pending' || r.status === 'Cancelled') return '—';
    var e = byName[r.approver];
    return r.approver + (e ? ' (' + e.designation + ')' : '');
  }

  /* data.js records the decision as a day only. The clock part is
     derived from the request id so it is stable across re-renders,
     and lands inside the 19:00–04:00 shift the approvers work. */
  function decidedAt(r) {
    if (r.status === 'Pending' || r.status === 'Cancelled') return '—';
    return dmy(r.applied) + ' ' + pad(19 + r.id % 3) + ':' + pad(r.id * 7 % 60) + ':' + pad(r.id * 13 % 60);
  }

  /* Sick leave is the one application Validure asks paper for, so the
     attachment is derived from the type rather than added to data.js. */
  function attachment(r) {
    return r.type === 'Sick Leave' ? 'Medical certificate ' + fmt(r.from) + '.pdf' : null;
  }

  /* data.js has no open request for the signed-in employee — every own
     row there is already decided — and editing or cancelling one is the
     whole point of this screen. data.js is shared with the other pages,
     so the open application is derived here: next id in the sequence,
     the employee's own manager as approver, a type off D.leaveTypes. */
  var el = D.leaveTypes.filter(function (t) { return t.code === 'EL'; })[0];
  var open = {
    id: D.leaveRequests.reduce(function (m, r) { return Math.max(m, r.id); }, 0) + 1,
    emp: D.me.name, code: D.me.code,
    type: el.name,
    from: '2026-10-12', to: '2026-10-14',
    reason: 'Sister’s housewarming in Coimbatore — travelling on the 11th.',
    status: 'Pending', applied: '2026-09-19', approver: D.me.manager
  };
  open.days = workingDays(open.from, open.to);

  var rows = D.leaveRequests
    .filter(function (r) { return r.code === D.me.code; })
    .concat([open])
    .sort(function (a, b) { return a.applied === b.applied ? b.id - a.id : (a.applied < b.applied ? 1 : -1); });

  var STATUS = {
    Pending:   { label: 'Awaiting Approval', tone: 'warn' },
    Approved:  { label: 'Approved',          tone: 'ok' },
    Rejected:  { label: 'Rejected',          tone: 'err' },
    Cancelled: { label: 'Cancelled',         tone: 'neutral' }
  };

  function find(id) {
    return rows.filter(function (r) { return r.id === +id; })[0];
  }

  /* ---- alerts ---------------------------------------------------- */
  var timer;
  function showAlert(kind, msg) {
    var box = $('alert'), ok = kind === 'ok', ink = ok ? 'var(--ok)' : 'var(--err-text)';
    box.hidden = false;
    box.className = 'card';
    box.setAttribute('role', ok ? 'status' : 'alert');
    box.style.boxShadow = 'none';
    box.style.background = ok ? 'var(--ok-soft)' : 'var(--err-soft)';
    box.style.borderColor = ok ? 'var(--ok)' : 'var(--err)';
    box.innerHTML = '<div class="row" style="gap:var(--s3);padding:var(--s4) var(--s5)">' +
      '<span style="display:flex;color:' + ink + '">' + VHR.icon(ok ? 'check' : 'alert', 18) + '</span>' +
      '<p style="font-size:.875rem;font-weight:500;color:' + ink + '">' + msg + '</p>' +
      '<span class="spacer"></span>' +
      '<button class="iconbtn" data-dismiss aria-label="Dismiss this message">' + VHR.icon('x', 16) + '</button>' +
      '</div>';
    clearTimeout(timer);
    if (ok) timer = setTimeout(hideAlert, 4000);
  }
  function hideAlert() { var box = $('alert'); box.hidden = true; box.innerHTML = ''; }
  $('alert').addEventListener('click', function (e) {
    if (e.target.closest('[data-dismiss]')) hideAlert();
  });

  /* ---- table ----------------------------------------------------- */
  var EMPTY = '<div class="empty">' +
    '<span class="empty__icon">' + VHR.icon('inbox', 22) + '</span>' +
    '<h3>No leave applications yet</h3>' +
    '<p>Every leave you apply for lands here with its approval outcome. Anything still awaiting approval can be edited or cancelled from this table.</p>' +
    '<a class="btn btn--primary btn--sm" href="apply.html">Apply for leave</a></div>';

  function render() {
    $('subline').textContent = D.me.name + ' · ' + D.me.code + ' · newest applied first';
    $('count').textContent = rows.length + (rows.length === 1 ? ' application' : ' applications');

    if (!rows.length) {
      $('rows').innerHTML = '<tr><td colspan="10">' + EMPTY + '</td></tr>';
      return;
    }

    $('rows').innerHTML = rows.map(function (r) {
      var st = STATUS[r.status], doc = attachment(r), unpaid = r.type === 'Loss of Pay';
      return '<tr>' +
        '<td class="mono" style="white-space:nowrap">' + dmy(r.applied) + '</td>' +
        '<td>' + r.type +
          (unpaid ? ' <span class="badge badge--warn">Unpaid</span>' : '') + '</td>' +
        '<td class="mono" style="white-space:nowrap">' + dmy(r.from) + ' → ' + dmy(r.to) + '</td>' +
        '<td class="num">' + r.days + '</td>' +
        '<td>' + (doc
          ? '<button class="btn btn--quiet btn--sm" data-act="doc" data-id="' + r.id + '" aria-label="View ' + doc + '">' +
            VHR.icon('fileText', 13) + 'View</button>'
          : '<span class="faint">—</span>') + '</td>' +
        '<td><span class="badge badge--' + st.tone + '">' + st.label + '</span></td>' +
        '<td class="muted">' + decidedBy(r) + '</td>' +
        '<td class="mono muted" style="white-space:nowrap">' + decidedAt(r) + '</td>' +
        '<td class="muted" style="max-width:14rem">' + (r.note || '—') + '</td>' +
        '<td>' + (r.status === 'Pending'
          ? '<div class="row" style="justify-content:flex-end;gap:var(--s2)">' +
            '<button class="btn btn--quiet btn--sm" data-act="edit" data-id="' + r.id + '">' +
            VHR.icon('settings', 13) + 'Edit</button>' +
            '<button class="btn btn--quiet btn--sm" style="color:var(--err-text)" data-act="cancel" data-id="' + r.id + '">' +
            VHR.icon('x', 13) + 'Cancel</button></div>'
          : '') + '</td>' +
        '</tr>';
    }).join('');
  }

  $('rows').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var r = find(btn.getAttribute('data-id'));
    if (!r) return;
    if (btn.getAttribute('data-act') === 'doc') VHR.toast('Not in this mockup');
    if (btn.getAttribute('data-act') === 'edit') openEdit(r);
    if (btn.getAttribute('data-act') === 'cancel') openCancel(r);
  });

  /* ---- edit ------------------------------------------------------ */
  function openEdit(r) {
    /* The row can have been decided or cancelled since it was drawn. */
    if (r.status !== 'Pending') {
      showAlert('err', 'Only pending applications can be edited (this one is ' + r.status + ')');
      return;
    }
    var types = D.leaveTypes.map(function (t) {
      return '<option value="' + t.name + '"' + (t.name === r.type ? ' selected' : '') + '>' + t.name + '</option>';
    }).join('');

    var close = VHR.modal({
      title: 'Edit leave application #' + r.id,
      sub: 'Saving re-notifies ' + r.approver + ', and the working-day count is recalculated.',
      foot: null,
      body:
        '<form id="editform" class="stack" style="gap:var(--s4)">' +
          '<div class="field">' +
            '<label class="label" for="etype">Leave type <span class="req">*</span></label>' +
            '<select class="select" id="etype" name="type" required>' + types + '</select>' +
          '</div>' +
          '<div class="fieldrow">' +
            '<div class="field">' +
              '<label class="label" for="efrom">From date <span class="req">*</span></label>' +
              '<input class="input" type="date" id="efrom" name="from" value="' + r.from + '" aria-describedby="edays" required>' +
            '</div>' +
            '<div class="field">' +
              '<label class="label" for="eto">To date <span class="req">*</span></label>' +
              '<input class="input" type="date" id="eto" name="to" value="' + r.to + '" min="' + r.from + '" aria-describedby="edays" required>' +
            '</div>' +
          '</div>' +
          '<p class="help" id="edays"></p>' +
          '<div class="field">' +
            '<label class="label" for="ereason">Reason <span class="req">*</span></label>' +
            '<textarea class="textarea" id="ereason" name="reason" rows="3" required>' + r.reason + '</textarea>' +
          '</div>' +
          '<div class="field">' +
            '<label class="label" for="edoc">Replace document (optional)</label>' +
            '<input class="input" type="file" id="edoc" name="doc" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">' +
            '<p class="help">Leave empty to keep the current document. The approvers are re-notified after saving.</p>' +
          '</div>' +
          '<div class="row" style="justify-content:flex-end;gap:var(--s3);margin-top:var(--s2)">' +
            '<button type="button" class="btn btn--ghost" data-close>Cancel</button>' +
            '<button type="submit" class="btn btn--primary">Save changes</button>' +
          '</div>' +
        '</form>'
    });

    var form = document.getElementById('editform'),
        from = document.getElementById('efrom'),
        to = document.getElementById('eto'),
        days = document.getElementById('edays');

    function recount() {
      to.min = from.value;
      if (to.value < from.value) to.value = from.value;
      var n = workingDays(from.value, to.value);
      days.textContent = n + (n === 1 ? ' working day' : ' working days') +
        ' — weekends and declared holidays are not counted.';
      return n;
    }
    recount();
    from.addEventListener('change', recount);
    to.addEventListener('change', recount);

    VHR.fakeSubmit(form, 'Leave application updated');
    form.addEventListener('submit', function () {
      var n = recount(),
          type = document.getElementById('etype').value,
          reason = document.getElementById('ereason').value;
      /* Matches the spinner fakeSubmit runs on the submit button. */
      setTimeout(function () {
        r.type = type; r.from = from.value; r.to = to.value; r.days = n; r.reason = reason;
        close();
        render();
        showAlert('ok', 'Leave application updated (' + n + ' working day(s)) — the approvers have been notified.');
      }, 720);
    });
  }

  /* ---- cancel ---------------------------------------------------- */
  function openCancel(r) {
    if (r.status !== 'Pending') { showAlert('err', 'Already ' + r.status); return; }
    var close = VHR.modal({
      title: 'Cancel this leave application?',
      sub: '#' + r.id + ' · ' + r.type,
      body:
        '<p class="muted" style="font-size:.875rem">Cancelling withdraws the request from ' + r.approver +
        '’s queue and returns the days to your balance. You can apply again at any time.</p>' +
        '<div class="row row--wrap" style="gap:var(--s2)">' +
          '<span class="chip">' + fmt(r.from) + ' → ' + fmt(r.to) + '</span>' +
          '<span class="chip"><span class="num">' + r.days + '</span> working days</span>' +
          '<span class="chip">Applied ' + fmt(r.applied) + '</span>' +
        '</div>',
      foot: '<button class="btn btn--ghost" data-close>Keep application</button>' +
            '<button class="btn btn--danger" data-ok>Cancel application</button>',
      onOk: function () {
        r.status = 'Cancelled';
        close();
        render();
        showAlert('ok', 'Leave application cancelled');
      }
    });
  }

  render();
})();
</script>
</body>
</html>
